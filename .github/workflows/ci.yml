name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push to the same branch supersedes any run still in flight, except on
# master — cancelling there would leave a merged commit with no CI result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project:
          - auto-login
          - jira/jira-ticket-extractor
          - gitlab/gitlab-code-search
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # The committed bundle is what @downloadURL serves straight off master, so a
      # stale one ships broken code to anyone who auto-updates. Rebuild and require
      # the result to be byte-identical to what was committed.
      #
      # Gate on `git status --porcelain`, not `git diff`: git diff only compares
      # tracked files, so a build output that was renamed or never committed is
      # invisible to it and the check passes while the stale bundle keeps shipping.
      - name: Committed bundle matches source
        run: |
          npm run build
          drift=$(git status --porcelain -- '*.user.js')
          if [ -n "$drift" ]; then
            echo "$drift"
            git diff -- '*.user.js'
            echo "::error::Committed bundle is out of date. Run 'npm ci && npm run build' in ${{ matrix.project }} and commit the result."
            exit 1
          fi

  # Auto Login stores and shares credentials in recoverable plaintext by design
  # (docs/adr/0003), so an exported share string is a credential dump that reads
  # as ordinary text. This repo is public and the pre-commit hook only bumps
  # @version — nothing else stops that reaching master.
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, not a shallow clone: the scan below walks every commit,
      # and at depth 1 it would silently have nothing to walk.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Installed as a pinned, checksum-verified binary rather than via a
      # marketplace action: one less third-party action in the supply chain and
      # nothing extra to keep SHA-pinned. Dependabot does not bump this version
      # — see the note in .github/dependabot.yml.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --retry-all-errors -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      # Scans full history rather than just the PR range. History is clean as of
      # this commit (verified across all 64 commits), so this is not a check that
      # arrives red. Computing a base..head range is the part that tends to break
      # quietly — a wrong base scans nothing and still exits 0 — and at ~1s for
      # this repo the whole-history scan buys immunity to that for no real time.
      #
      # Know the failure mode before you hit it: a hit anywhere in history fails
      # this job on EVERY branch, and deleting the secret in a later commit does
      # not clear it — the blob is still reachable. That is deliberate and
      # matches the repo's git-workflow standard, which calls for a history
      # rewrite on a leak rather than a cleanup commit. If a rewrite genuinely
      # has to be deferred, `--baseline-path` or a `.gitleaksignore` entry
      # unblocks merges without pretending the secret is gone.
      #
      # --redact keeps the matched secret out of the public build log.
      - name: gitleaks
        run: |
          "$RUNNER_TEMP/gitleaks" git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1
